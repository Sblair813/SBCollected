title: 'Susan Blair Collected'
description: 'A collection of articles and projects.' 
theme: minima

baseurl: "/SBCollected"
url: "https://sblair813.github.io"

# Whitelist specific pages for header/footer navigation
header_pages:
  - index.md

defaults:
  - scope:
      path: ""       # Targets the entire project repository
      type: "posts"  # Targets post files
    values:
      categories: [] # Strips out folder-based categories
